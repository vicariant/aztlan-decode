<style>
.compliance-banner {
    position: fixed;
    top: 72px;
    left: 0;
    right: 0;
    background: #ffffff;
    border-bottom: 1px solid #e5e5e5;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    z-index: 999;
    animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 90vh;
    overflow-y: auto;
}

@keyframes slideDown {
    from {
        transform: translateY(-100%);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes slideUp {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-100%);
        opacity: 0;
    }
}

.banner-container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 1.5rem;
}

.banner-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
}

.banner-icon {

    flex-shrink: 0;
}

.banner-header h3 {
    color: #171717;

    font-weight: 600;
    margin: 0;
    flex: 1;
}

.banner-header p {
    color: #525252;
    font-size: 0.875rem;
    margin: 0.25rem 0 0 0;
    line-height: 1.5;
}

.banner-close {
    background: transparent;
    border: none;
    color: #737373;
    font-size: 1.5rem;
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 0.375rem;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
}

.banner-close:hover {
    background: #f5f5f5;
    color: #171717;
}

.banner-features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.75rem;
    margin: 1rem 0;
}

.feature-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;

</style>

<script>
// Función para cerrar el banner
window.closeBanner = function() {
    var banner = document.getElementById('complianceBanner');
    if (banner) {
        banner.style.animation = 'slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        setTimeout(function() {
            banner.style.display = 'none';
            localStorage.setItem('complianceBannerClosed', 'true');
        }, 300);
    }
};

window.showPrivacyPolicy = function() {
    alert('📄 Política de Privacidad\n\n' +
          '🔒 Protegemos tus datos con:\n' +
          '  • Encriptación AES-256\n' +
          '  • Sin venta de datos a terceros\n' +
          '  • Control total sobre tu información\n' +
          '  • Cumplimiento GDPR, COPPA, AADC\n\n' +
          '📧 Para más información: privacy@aztlan-decode.com');
};

window.showParentalControls = function() {
    alert('👨‍👩‍👧 Controles Parentales\n\n' +
          '⚙️ Configura:\n' +
          '  • Límites de tiempo de uso\n' +
          '  • Filtros de contenido\n' +
          '  • Monitoreo de actividad\n' +
          '  • Reportes semanales\n\n' +
          '📧 Contacta soporte para activarlos:\n' +
          '   parental@aztlan-decode.com');
};

window.contactSupport = function() {
    window.location.href = 'mailto:support@aztlan-decode.com?subject=Consulta sobre Protección de Menores';
};

// Verificar si el banner ya fue cerrado al cargar la página
(function() {
    var bannerClosed = localStorage.getItem('complianceBannerClosed');
    var banner = document.getElementById('complianceBanner');
    
    if (bannerClosed === 'true' && banner) {
        banner.style.display = 'none';
    }
})();
</script>
