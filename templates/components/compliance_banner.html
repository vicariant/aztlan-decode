<style>
.compliance-banner {
    position: fixed;
    top: 72px;
    left: 0;
    right: 0;
    background: linear-gradient(135deg, 
        rgba(14, 165, 233, 0.03) 0%, 
        rgba(139, 92, 246, 0.03) 50%,
        rgba(14, 165, 233, 0.03) 100%);
    background-size: 200% 200%;
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(14, 165, 233, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
    z-index: 999;
    animation: slideDown 0.5s cubic-bezier(0.4, 0, 0.2, 1),
               gradientShift 8s ease infinite;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
}

/* Animated gradient background */
@keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* Floating particles effect */
.compliance-banner::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: 
        radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 107, 53, 0.1) 0%, transparent 40%);
    animation: particleFloat 10s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes particleFloat {
    0%, 100% { 
        transform: translateY(0) scale(1);
        opacity: 0.5;
    }
    50% { 
        transform: translateY(-10px) scale(1.05);
        opacity: 0.8;
    }
}

/* Shine effect */
.compliance-banner::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        45deg,
        transparent 30%,
        rgba(255, 255, 255, 0.1) 50%,
        transparent 70%
    );
    animation: shine 6s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
}

@keyframes shine {
    0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
    100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

@keyframes slideDown {
    from {
        transform: translateY(-100%);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes slideUp {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-100%);
        opacity: 0;
    }
}

.banner-container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 1.5rem;
    position: relative;
    z-index: 2;
}

.banner-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
}

.banner-icon {
    font-size: 2.5rem;
    flex-shrink: 0;
    animation: iconPulse 3s ease-in-out infinite;
    filter: drop-shadow(0 4px 8px rgba(14, 165, 233, 0.3));
}

@keyframes iconPulse {
    0%, 100% { 
        transform: scale(1);
        filter: drop-shadow(0 4px 8px rgba(14, 165, 233, 0.3));
    }
    50% { 
        transform: scale(1.1);
        filter: drop-shadow(0 6px 12px rgba(139, 92, 246, 0.4));
    }
}

.banner-header h3 {
    color: var(--text-primary, #171717);
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0;
    flex: 1;
    background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.banner-header p {
    color: var(--text-secondary, #525252);
    font-size: 0.875rem;
    margin: 0.25rem 0 0 0;
    line-height: 1.5;
}

.banner-close {
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(14, 165, 233, 0.2);
    color: #737373;
    font-size: 1.5rem;
    width: 2.5rem;
    height: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 50%;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.banner-close:hover {
    background: linear-gradient(135deg, #ff6b35 0%, #0ea5e9 100%);
    color: white;
    transform: rotate(90deg) scale(1.1);
    border-color: transparent;
    box-shadow: 0 4px 16px rgba(255, 107, 53, 0.4);
}

.banner-features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.75rem;
    margin: 1rem 0;
}

.feature-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.9) 0%, 
        rgba(255, 255, 255, 0.7) 100%);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(14, 165, 233, 0.2);
    border-radius: 12px;
    font-size: 0.875rem;
    color: var(--text-primary, #404040);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: default;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    position: relative;
    overflow: hidden;
}

.feature-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(14, 165, 233, 0.1) 50%, 
        transparent 100%);
    transition: left 0.5s ease;
}

.feature-item:hover::before {
    left: 100%;
}

.feature-item:hover {
    transform: translateY(-2px) scale(1.02);
    border-color: rgba(14, 165, 233, 0.4);
    box-shadow: 0 8px 24px rgba(14, 165, 233, 0.15);
}

.feature-icon {
    color: #0ea5e9;
    font-weight: 700;
    font-size: 1.1rem;
    animation: checkBounce 2s ease-in-out infinite;
}

@keyframes checkBounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

.feature-item:nth-child(1) .feature-icon { animation-delay: 0s; }
.feature-item:nth-child(2) .feature-icon { animation-delay: 0.2s; }
.feature-item:nth-child(3) .feature-icon { animation-delay: 0.4s; }
.feature-item:nth-child(4) .feature-icon { animation-delay: 0.6s; }
.feature-item:nth-child(5) .feature-icon { animation-delay: 0.8s; }
.feature-item:nth-child(6) .feature-icon { animation-delay: 1s; }

.banner-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-top: 1.5rem;
}

.banner-actions .btn {
    position: relative;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(14, 165, 233, 0.3);
    background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.9) 0%, 
        rgba(255, 255, 255, 0.8) 100%);
    backdrop-filter: blur(10px);
}

.banner-actions .btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: radial-gradient(circle, 
        rgba(14, 165, 233, 0.2) 0%, 
        transparent 70%);
    transform: translate(-50%, -50%);
    transition: width 0.5s ease, height 0.5s ease;
}

.banner-actions .btn:hover::before {
    width: 300px;
    height: 300px;
}

.banner-actions .btn:hover {
    transform: translateY(-2px);
    border-color: rgba(14, 165, 233, 0.5);
    box-shadow: 0 8px 24px rgba(14, 165, 233, 0.2);
}

.banner-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 1rem;
}

/* Dark Mode Styles */
[data-theme="dark"] .compliance-banner {
    background: linear-gradient(135deg, 
        rgba(14, 165, 233, 0.08) 0%, 
        rgba(139, 92, 246, 0.08) 50%,
        rgba(14, 165, 233, 0.08) 100%);
    border-bottom-color: rgba(14, 165, 233, 0.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

[data-theme="dark"] .compliance-banner::before {
    background-image: 
        radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 107, 53, 0.15) 0%, transparent 40%);
}

[data-theme="dark"] .feature-item {
    background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.05) 0%, 
        rgba(255, 255, 255, 0.02) 100%);
    border-color: rgba(14, 165, 233, 0.3);
    color: var(--text-primary, #fafafa);
}

[data-theme="dark"] .feature-item:hover {
    background: linear-gradient(135deg, 
        rgba(14, 165, 233, 0.15) 0%, 
        rgba(139, 92, 246, 0.15) 100%);
    border-color: rgba(14, 165, 233, 0.5);
    box-shadow: 0 8px 24px rgba(14, 165, 233, 0.3);
}

[data-theme="dark"] .banner-actions .btn {
    background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.05) 0%, 
        rgba(255, 255, 255, 0.02) 100%);
    border-color: rgba(14, 165, 233, 0.3);
    color: var(--text-primary, #fafafa);
}

[data-theme="dark"] .banner-actions .btn:hover {
    border-color: rgba(14, 165, 233, 0.6);
    box-shadow: 0 8px 24px rgba(14, 165, 233, 0.4);
}

[data-theme="dark"] .banner-close {
    background: rgba(0, 0, 0, 0.3);
    border-color: rgba(14, 165, 233, 0.3);
    color: #fafafa;
}

@media (max-width: 768px) {
    .compliance-banner {
        top: 64px;
    }
    
    .banner-container {
        padding: 1rem;
    }
    
    .banner-header {
        flex-wrap: wrap;
    }
    
    .banner-close {
        order: -1;
        margin-left: auto;
    }
    
    .banner-features {
        grid-template-columns: 1fr;
        gap: 0.5rem;
    }
    
    .banner-actions {
        flex-direction: column;
    }
    
    .banner-actions .btn {
        width: 100%;
        justify-content: center;
    }
}

@media (max-width: 480px) {
    .banner-container {
        padding: 0.75rem;
    }
    
    .banner-icon {
        font-size: 1.5rem;
    }
    
    .banner-header h3 {
        font-size: 1.125rem;
    }
}
</style>

<script>
// Esperar a que el DOM esté listo
document.addEventListener('DOMContentLoaded', function() {
    var banner = document.getElementById('complianceBanner');
    var closeBtn = document.getElementById('closeBannerBtn');
    var privacyBtn = document.getElementById('privacyBtn');
    var parentalBtn = document.getElementById('parentalBtn');
    var supportBtn = document.getElementById('supportBtn');
    
    // Verificar si el banner ya fue cerrado
    var bannerClosed = localStorage.getItem('complianceBannerClosed');
    if (bannerClosed === 'true' && banner) {
        banner.style.display = 'none';
    }
    
    // Función para cerrar el banner
    if (closeBtn) {
        closeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (banner) {
                banner.style.animation = 'slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                setTimeout(function() {
                    banner.style.display = 'none';
                    localStorage.setItem('complianceBannerClosed', 'true');
                }, 300);
            }
        });
    }
    
    // Botón política de privacidad
    if (privacyBtn) {
        privacyBtn.addEventListener('click', function() {
            alert('📄 Política de Privacidad\n\n' +
                  '🔒 Protegemos tus datos con:\n' +
                  '  • Encriptación AES-256\n' +
                  '  • Sin venta de datos a terceros\n' +
                  '  • Control total sobre tu información\n' +
                  '  • Cumplimiento GDPR, COPPA, AADC\n\n' +
                  '📧 Para más información: privacy@aztlan-decode.com');
        });
    }
    
    // Botón controles parentales
    if (parentalBtn) {
        parentalBtn.addEventListener('click', function() {
            alert('👨‍👩‍👧 Controles Parentales\n\n' +
                  '⚙️ Configura:\n' +
                  '  • Límites de tiempo de uso\n' +
                  '  • Filtros de contenido\n' +
                  '  • Monitoreo de actividad\n' +
                  '  • Reportes semanales\n\n' +
                  '📧 Contacta soporte para activarlos:\n' +
                  '   parental@aztlan-decode.com');
        });
    }
    
    // Botón contactar soporte
    if (supportBtn) {
        supportBtn.addEventListener('click', function() {
            window.location.href = 'mailto:support@aztlan-decode.com?subject=Consulta sobre Protección de Menores';
        });
    }
});
</script>
