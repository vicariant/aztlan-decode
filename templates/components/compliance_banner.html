<style>
/* FTC/NASA Mission Control Compliance Banner */
.compliance-banner {
    position: fixed;
    top: 80px;
    left: 0;
    right: 0;
    background: linear-gradient(145deg, rgba(10, 14, 39, 0.98) 0%, rgba(5, 8, 16, 0.95) 100%);
    backdrop-filter: blur(20px);
    border-bottom: 2px solid #FF6B35;
    box-shadow: 0 8px 32px rgba(255, 107, 53, 0.3);
    z-index: 999;
    animation: slideDown 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
}

/* Animated Tech Grid Background */
.compliance-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
        linear-gradient(90deg, rgba(0, 102, 179, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0, 102, 179, 0.08) 1px, transparent 1px);
    background-size: 30px 30px;
    animation: gridMove 15s linear infinite;
    pointer-events: none;
    opacity: 0.5;
}

@keyframes gridMove {
    0% { transform: translate(0, 0); }
    100% { transform: translate(30px, 30px); }
}

@keyframes slideDown {
    from {
        transform: translateY(-100%);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes slideUp {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-100%);
        opacity: 0;
    }
}

.banner-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.5rem 2rem;
    position: relative;
    z-index: 2;
}

.banner-header {
    display: flex;
    align-items: flex-start;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
}

.banner-icon {
    font-size: 2.5rem;
    flex-shrink: 0;
    filter: drop-shadow(0 0 15px rgba(255, 107, 53, 0.6));
    animation: iconPulse 3s ease-in-out infinite;
}

@keyframes iconPulse {
    0%, 100% { 
        transform: scale(1);
        filter: drop-shadow(0 0 15px rgba(255, 107, 53, 0.6));
    }
    50% { 
        transform: scale(1.1);
        filter: drop-shadow(0 0 25px rgba(0, 102, 179, 0.8));

    flex: 1;
}

    margin: 0 0 0.5rem 0;

    color: rgba(255, 255, 255, 0.7);

    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 107, 53, 0.3);

    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;

}

.banner-close:hover {
    background: linear-gradient(135deg, #FF6B35, #0066B3);
    border-color: transparent;
    transform: rotate(90deg) scale(1.15);

    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

    margin: 1.5rem 0;
}

    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 107, 53, 0.2);

.feature-item::before {

.feature-item:hover::before {

}

    border-color: #FF6B35;
    background: rgba(255, 107, 53, 0.08);

}

}

.banner-actions .btn {

    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s ease;

    overflow: hidden;
}

.banner-actions .btn::before {
    content: '';
    position: absolute;
    top: 50%;

    border-radius: 50%;

    transform: translate(-50%, -50%);

.banner-actions .btn:hover::before {

}

@media (max-width: 768px) {
    .compliance-banner {
        top: 80px;
    }

        padding: 1rem;

</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const banner = document.getElementById('complianceBanner');
    const closeBtn = document.getElementById('closeBannerBtn');
    const privacyBtn = document.getElementById('privacyBtn');
    const parentalBtn = document.getElementById('parentalBtn');
    const supportBtn = document.getElementById('supportBtn');
    
    // Check if banner should be shown
    if (localStorage.getItem('bannerClosed') === 'true') {
        banner.style.display = 'none';
    }
    
    // Close banner
    if (closeBtn) {
        closeBtn.addEventListener('click', function() {
            banner.style.animation = 'slideUp 0.4s ease-out forwards';
            setTimeout(() => {
                banner.style.display = 'none';
                localStorage.setItem('bannerClosed', 'true');
            }, 400);
        });
    }
    
    // Privacy policy
    if (privacyBtn) {
        privacyBtn.addEventListener('click', function() {
            window.open('/privacy', '_blank');
        });
    }
    
    // Parental controls
    if (parentalBtn) {
        parentalBtn.addEventListener('click', function() {
            window.open('/parental-controls', '_blank');
        });
    }
    
    // Support
    if (supportBtn) {
        supportBtn.addEventListener('click', function() {
            window.location.href = 'mailto:support@aztlandecode.com?subject=Consulta de Compliance';
        });
    }
});
</script>
